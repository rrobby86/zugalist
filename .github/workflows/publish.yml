name: Publish main branch using GitHub Pages

on:
  push:
    branches:
      - main
    schedule:
      - cron: "0 3 * * 0"
    workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Setup node
        id: setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Build game list
        id: buildGames
        run: node scripts/updateGames.mjs
        env:
          BGG_API_KEY: ${{ secrets.BGG_API_KEY }}
      - name: Build
        id: build
        run: npm run build-only -- --base /zugalist/
      - name: Upload built files as artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
